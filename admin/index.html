<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Panel NekoStore</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<section id="loginView" class="login hidden">
  <form id="loginForm" class="login-card" autocomplete="on">
    <h1>Panel NekoStore</h1>
    <p class="muted">Acceso solo para el administrador.</p>
    <label for="loginPassword">Contraseña</label>
    <input id="loginPassword" name="password" type="password" autocomplete="current-password" required maxlength="200">
    <p id="loginError" class="error hidden" role="alert"></p>
    <button type="submit" class="btn primary">Entrar</button>
  </form>
</section>

<section id="appView" class="hidden">
  <header class="topbar">
    <h1>Inventario</h1>
    <div class="topbar-actions">
      <button id="newBtn" class="btn primary">+ Nueva figura</button>
      <button id="exportBtn" class="btn">Exportar CSV</button>
      <a class="btn" href="/" target="_blank" rel="noopener">Ver sitio</a>
      <button id="logoutBtn" class="btn">Salir</button>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar figura, marca o colección…" autocomplete="off">
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab active" data-filter="stock">En stock</button>
      <button class="tab" data-filter="sold">Agotadas</button>
      <button class="tab" data-filter="upcoming">Próximas</button>
      <button class="tab" data-filter="all">Todas</button>
    </div>
  </div>

  <main id="list" class="list"></main>
  <p id="empty" class="muted center hidden">No hay figuras en esta vista.</p>
</section>

<dialog id="editDialog" class="dialog">
  <form id="editForm" method="dialog" class="edit-form">
    <h2 id="editTitle">Editar figura</h2>

    <div class="img-block">
      <img id="imgPreview" class="img-preview" alt="Vista previa">
      <div class="img-controls">
        <label class="btn small file-btn">Subir foto
          <input id="imgFile" type="file" accept="image/jpeg,image/png,image/webp" class="hidden">
        </label>
        <div class="url-row">
          <input id="imgUrl" type="url" placeholder="o pega una URL de imagen" autocomplete="off">
          <button type="button" id="imgFetch" class="btn small">Traer</button>
        </div>
        <p id="imgMsg" class="muted small-text"></p>
      </div>
    </div>

    <label for="fName">Nombre</label>
    <input id="fName" maxlength="120" required>

    <div class="grid2">
      <div>
        <label for="fPrice">Precio (MXN)</label>
        <input id="fPrice" type="number" min="0" step="0.01" required>
      </div>
      <div>
        <label for="fStock">Stock</label>
        <input id="fStock" type="number" min="0" max="9999" step="1" required>
      </div>
    </div>

    <div class="grid2">
      <div>
        <label for="fCondition">Condición</label>
        <select id="fCondition">
          <option value="NEW">Nueva</option>
          <option value="USED">Usada</option>
        </select>
      </div>
      <div>
        <label for="fStatus">Dónde aparece</label>
        <select id="fStatus">
          <option value="">Catálogo normal</option>
          <option value="PROXIMO">Próxima mercancía</option>
        </select>
      </div>
    </div>

    <div id="arrivalRow" class="hidden">
      <label for="fArrival">Llegada estimada</label>
      <input id="fArrival" type="date">
    </div>

    <div class="grid2">
      <div>
        <label for="fBrand">Marca</label>
        <input id="fBrand" maxlength="80" list="brandList">
        <datalist id="brandList"></datalist>
      </div>
      <div>
        <label for="fCollection">Colección / línea</label>
        <input id="fCollection" maxlength="80" list="collectionList">
        <datalist id="collectionList"></datalist>
      </div>
    </div>

    <label for="fDescription">Descripción</label>
    <textarea id="fDescription" rows="3" maxlength="2000"></textarea>

    <label class="check"><input id="fFeatured" type="checkbox"> Destacada (aparece en el carrusel)</label>

    <p id="editError" class="error hidden" role="alert"></p>

    <div class="dialog-actions">
      <button type="button" id="deleteBtn" class="btn danger hidden">Eliminar</button>
      <span class="spacer"></span>
      <button type="button" id="cancelBtn" class="btn">Cancelar</button>
      <button type="submit" id="saveBtn" class="btn primary">Guardar</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast hidden" role="status"></div>

<script src="admin.js"></script>
</body>
</html>
